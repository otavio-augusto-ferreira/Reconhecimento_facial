# E01b — pontos de operação do FaceNet pré-treinado (mesmo modelo, detector e cache do E01).
# Rode a partir da raiz do repositório (depois do E01, para reaproveitar o cache de embeddings):
#   python experiments/e01b_operating_points.py --config configs/e01b_operating_points.yaml
experiment: E01b
seed: 42
image_root: data/public/lfw
splits_manifest: experiments/splits/lfw_seed42.json
cache_dir: data/public/cache                      # o MESMO do E01: não recalcula embeddings
output_dir: experiments/results/e01b
device: cpu

detector:                                         # idêntico ao E01 (a assinatura do cache depende disso)
  min_confidence: 0.9
  min_face_size: 20
  margin_ratio: 0.0
  rotate_to_eyes: false

model:
  pretrained: vggface2
  batch_size: 32

pairs:                                            # mais pares que no E01, para resolver FAR pequenos
  val: 40000                                      # (gera menos se faltarem pares positivos distintos)
  test: 40000

score: cosine

operating_points:                                 # cada um escolhe o threshold SOMENTE na validação
  - {name: acuracia_maxima, criterion: accuracy}
  - {name: eer, criterion: eer}
  - {name: far_1pct, criterion: far, far_target: 0.01}
  - {name: far_0.1pct, criterion: far, far_target: 0.001}

registered_people: [5, 10, 20]                    # tamanhos de galeria para a estimativa de falsos aceites
